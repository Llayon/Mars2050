<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/></linearGradient>
    <g id="shape">
      <ellipse cx="50" cy="70" rx="30" ry="9" fill="#000" opacity="0.2"/>
      <polygon points="50,14 63,68 50,58 37,68" fill="url(#hull)" stroke="#0f172a" stroke-width="2"/>
      <polygon points="50,42 18,62 43,66" fill="url(#wing)" stroke="#0f172a" stroke-width="1.5"/>
      <polygon points="50,42 82,62 57,66" fill="url(#wing)" stroke="#0f172a" stroke-width="1.5"/>
      <polygon points="50,16 57,35 43,35" fill="#bef264" stroke="#365314" stroke-width="1"/>
      <circle cx="50" cy="31" r="3" fill="#a3e635" filter="url(#glow)"/>
      <path d="M38 72 L45 61 M62 72 L55 61" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <g transform="translate(0 0)"><g transform="translate(50 50) rotate(0) translate(-50 -50)"><use href="#shape"/></g></g>
