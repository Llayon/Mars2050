    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <g id="shape">
      <ellipse cx="50" cy="76" rx="25" ry="8" fill="#000" opacity="0.22"/>
      <polygon points="39,38 23,61 42,56" fill="#1d4ed8" stroke="#0f172a" stroke-width="1.5"/>
      <polygon points="61,38 77,61 58,56" fill="#1d4ed8" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="36" y="35" width="28" height="30" rx="7" fill="url(#armor)" stroke="#020617" stroke-width="2"/>
      <circle cx="50" cy="25" r="9" fill="#cbd5e1" stroke="#020617" stroke-width="2"/>
      <rect x="30" y="43" width="9" height="28" rx="3" fill="#334155" stroke="#020617" stroke-width="1"/>
      <rect x="61" y="43" width="9" height="28" rx="3" fill="#334155" stroke="#020617" stroke-width="1"/>
      <polygon points="33,71 38,88 43,71" fill="url(#flame)" filter="url(#jet)"/>
