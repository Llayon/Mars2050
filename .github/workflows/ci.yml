name: CI / CD

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - '**.md'
      - '.husky/**'
      - '.vscode/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.husky/**'
      - '.vscode/**'

jobs:
  check:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Architecture enforcer
        run: npx tsx scripts/check-limits.ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm t

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: team_DFP4DsmGOLgMIkCHRcvLSAIy
          VERCEL_PROJECT_ID: prj_mbP68XdydRuN10aEyLy99uCvIEuu
        run: npx vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Supabase Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: gkvsnzwvgonfpuespafm
        run: |
          npx supabase db push --password $SUPABASE_DB_PASSWORD
